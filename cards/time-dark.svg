
      <svg
        width="495"
        height="165"
        viewBox="0 0 495 165"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId"></title>
        <desc id="descId"></desc>
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #fff;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #9f9f9f;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .not_bold { font-weight: 400 }
    .bold { font-weight: 700 }
  
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .lang-name { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #9f9f9f }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          
        </style>

        

        <rect
          data-testid="card-bg"
          x="0.5"
          y="0.5"
          rx="4.5"
          height="99%"
          stroke="#e4e2e2"
          width="494"
          fill="#151515"
          stroke-opacity="0"
        />

        
      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
      >Time stats (last week)</text>
    </g>
      </g>
    

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          
    <svg x="0" y="0" width="100%">
      
      <mask id="rect-mask">
      <rect x="25" y="0" width="440" height="8" fill="white" rx="5" />
      </mask>
      
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="0"
            y="0"
            width="232.3605"
            height="8"
            fill="#f34b7d"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="232.3605"
            y="0"
            width="77.6085"
            height="8"
            fill="#A97BFF"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="309.969"
            y="0"
            width="68.169"
            height="8"
            fill="#3572A5"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="378.138"
            y="0"
            width="28.923"
            height="8"
            fill="#083fa1"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="407.061"
            y="0"
            width="28.737"
            height="8"
            fill="#555555"
          />
        
          <rect
            mask="url(#rect-mask)"
            data-testid="lang-progress"
            x="435.798"
            y="0"
            width="28.5975"
            height="8"
            fill="#6E4C13"
          />
        
      
    <g transform="translate(25, 25)">
      <circle cx="5" cy="6" r="5" fill="#f34b7d" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        C++ - 8 hrs 44 mins
      </text>
    </g>
  
    <g transform="translate(230, 25)">
      <circle cx="5" cy="6" r="5" fill="#A97BFF" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Kotlin - 2 hrs 55 mins
      </text>
    </g>
  
    <g transform="translate(25, 50)">
      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Python - 2 hrs 34 mins
      </text>
    </g>
  
    <g transform="translate(230, 50)">
      <circle cx="5" cy="6" r="5" fill="#083fa1" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Markdown - 1 hrs 5 mins
      </text>
    </g>
  
    <g transform="translate(25, 75)">
      <circle cx="5" cy="6" r="5" fill="#555555" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        C - 1 hrs 5 mins
      </text>
    </g>
  
    <g transform="translate(230, 75)">
      <circle cx="5" cy="6" r="5" fill="#6E4C13" />
      <text data-testid="lang-name" x="15" y="10" class='lang-name'>
        Assembly - 1 hrs 5 mins
      </text>
    </g>
  
    
    </svg>
  
        </g>
      </svg>
    